<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders - Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 80px;
        }
        .navbar {
            background: rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: 500;
        }
        .main-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .page-title {
            color: #333;
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        .table {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .table thead th {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-weight: 600;
            padding: 15px;
        }
        .table tbody td {
            padding: 15px;
            vertical-align: middle;
            border-color: #f8f9fa;
        }
        .table tbody tr:hover {
            background-color: #f8f9fa;
            transform: scale(1.01);
            transition: all 0.2s ease;
        }
        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending {
            background: linear-gradient(45deg, #ffc107, #ffb300);
            color: #333;
        }
        .status-delivered {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
        }
        .status-cancelled {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
        }
        .amount-tag {
            background: linear-gradient(45deg, #17a2b8, #138496);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .payment-status {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .payment-paid {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        .payment-pending {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #6c757d;
        }
        .empty-icon {
            font-size: 5rem;
            margin-bottom: 30px;
            opacity: 0.3;
        }
        .order-id {
            font-family: 'Courier New', monospace;
            background: rgba(102, 126, 234, 0.1);
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: 600;
            color: #667eea;
        }
        .user-info {
            display: flex;
            align-items: center;
        }
        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            margin-right: 10px;
        }
        .stats-row {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-card {
            text-align: center;
            color: white;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Order Management
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/products"><i class="fas fa-box me-1"></i>Products</a>
                <a class="nav-link" href="/orders"><i class="fas fa-shopping-cart me-1"></i>Orders</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Stats Row -->
        <div class="stats-row">
            <div class="row">
                <div class="col-md-4">
                    <div class="stat-card">
                        <span class="stat-number" id="totalOrders">-</span>
                        <span class="stat-label">Total Orders</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <span class="stat-number" id="pendingOrders">-</span>
                        <span class="stat-label">Pending Orders</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <span class="stat-number" id="totalRevenue">-</span>
                        <span class="stat-label">Total Revenue</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-container">
            <h2 class="page-title">
                <i class="fas fa-shopping-cart me-3"></i>Order Management
            </h2>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th><i class="fas fa-hashtag me-2"></i>Order ID</th>
                            <th><i class="fas fa-user me-2"></i>Customer</th>
                            <th><i class="fas fa-info-circle me-2"></i>Status</th>
                            <th><i class="fas fa-dollar-sign me-2"></i>Amount</th>
                            <th><i class="fas fa-credit-card me-2"></i>Payment</th>
                            <th><i class="fas fa-calendar me-2"></i>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td>
                                <span class="order-id" th:text="${'#' + order.id}"></span>
                            </td>
                            <td>
                                <div class="user-info">
                                    <div class="user-avatar">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <span th:text="${order.user != null ? order.user.username : 'Guest User'}"></span>
                                </div>
                            </td>
                            <td>
                                <span th:class="${'status-badge ' + 
                                    (order.status == 'DELIVERED' ? 'status-delivered' : 
                                     order.status == 'PENDING' ? 'status-pending' : 'status-cancelled')}"
                                      th:text="${order.status}"></span>
                            </td>
                            <td>
                                <span class="amount-tag" th:text="${'$' + order.totalAmount}"></span>
                            </td>
                            <td>
                                <span th:class="${'payment-status ' + (order.paymentId != null ? 'payment-paid' : 'payment-pending')}"
                                      th:text="${order.paymentId != null ? 'Paid' : 'Pending'}"></span>
                            </td>
                            <td>
                                <span th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'MMM dd, yyyy') : 'N/A'}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="fas fa-shopping-cart empty-icon"></i>
                                    <h3>No Orders Found</h3>
                                    <p>Orders will appear here once customers start placing them.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load order statistics
        async function loadOrderStats() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                
                const totalOrders = orders.length;
                const pendingOrders = orders.filter(order => order.status === 'PENDING').length;
                const totalRevenue = orders.reduce((sum, order) => sum + order.totalAmount, 0);
                
                document.getElementById('totalOrders').textContent = totalOrders;
                document.getElementById('pendingOrders').textContent = pendingOrders;
                document.getElementById('totalRevenue').textContent = '$' + totalRevenue.toFixed(2);
            } catch (error) {
                console.error('Error loading order stats:', error);
                document.getElementById('totalOrders').textContent = '0';
                document.getElementById('pendingOrders').textContent = '0';
                document.getElementById('totalRevenue').textContent = '$0.00';
            }
        }
        
        loadOrderStats();
    </script>
</body>
</html>
