<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Order Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #9575cd, #ba68c8);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .hero-content {
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
        }
        .hero-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #9575cd, #ba68c8, #ce93d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
        }
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .nav-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }
        .nav-card:hover {
            transform: translateY(-10px);
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .nav-card:hover::before {
            left: 100%;
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .card-description {
            opacity: 0.8;
            font-size: 1rem;
        }
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }
        .shape:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        .shape:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-delay: 2s;
        }
        .shape:nth-child(3) {
            bottom: 10%;
            left: 20%;
            animation-delay: 4s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="floating-shapes">
            <div class="shape">
                <i class="fas fa-cube" style="font-size: 4rem;"></i>
            </div>
            <div class="shape">
                <i class="fas fa-shopping-cart" style="font-size: 3rem;"></i>
            </div>
            <div class="shape">
                <i class="fas fa-credit-card" style="font-size: 3.5rem;"></i>
            </div>
        </div>
        
        <div class="hero-content">
            <h1 class="hero-title">Order Management</h1>

            
            <div class="nav-cards">
                <a href="/products" class="nav-card">
                    <i class="fas fa-box card-icon" style="color: #512da8;"></i>
                    <div class="card-title">Product Management</div>
                    <div class="card-description">Manage your inventory, add new products, and track stock levels</div>
                </a>
                
                <a href="/orders" class="nav-card">
                    <i class="fas fa-shopping-cart card-icon" style="color: #512da8;"></i>
                    <div class="card-title">Order Processing</div>
                    <div class="card-description">Handle customer orders, track status, and manage fulfillment</div>
                </a>
                
                <a href="/payments" class="nav-card">
                    <i class="fas fa-credit-card card-icon" style="color: #512da8;"></i>
                    <div class="card-title">Payment Management</div>
                    <div class="card-description">Process payments, track transactions, and manage billing</div>
                </a>
                

                

                


            </div>
        </div>
    </div>
</body>
</html>
