<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>
</head>
<body style="font-family: Arial; padding: 20px; background: #f0f8ff;">
    <h1 style="color: white; text-align: center; background: #4ecdc4; padding: 20px; border-radius: 10px;">Orders</h1>
    
    <nav style="text-align: center; margin: 20px 0; padding: 15px; background: #1a1a2e; border-radius: 5px;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 20px; font-size: 18px;">Home</a>
        <a href="products.html" style="color: white; text-decoration: none; margin: 0 20px; font-size: 18px;">Products</a>
        <a href="login.html" style="color: white; text-decoration: none; margin: 0 20px; font-size: 18px;">Login</a>
    </nav>
    
    <div style="text-align: center; margin: 20px 0;">
        <button onclick="alert('Add Order clicked!')" style="background: #4ecdc4; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">Add Order</button>
    </div>
    
    <table style="width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <tr style="background: #4ecdc4; color: white;">
            <th style="padding: 15px; text-align: left;">Order ID</th>
            <th style="padding: 15px; text-align: left;">Customer</th>
            <th style="padding: 15px; text-align: left;">Amount</th>
            <th style="padding: 15px; text-align: left;">Status</th>
        </tr>
        <tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;">1</td>
            <td style="padding: 12px;">John Doe</td>
            <td style="padding: 12px; color: #6a4c93; font-weight: bold;">1029.98</td>
            <td style="padding: 12px; background: #ffe66d; color: #1a1a2e; border-radius: 5px; text-align: center;">PENDING</td>
        </tr>
        <tr style="background: #f8f9fa; border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;">2</td>
            <td style="padding: 12px;">Jane Smith</td>
            <td style="padding: 12px; color: #6a4c93; font-weight: bold;">229.98</td>
            <td style="padding: 12px; background: #ff6b6b; color: white; border-radius: 5px; text-align: center;">DELIVERED</td>
        </tr>
        <tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;">3</td>
            <td style="padding: 12px;">Mike Wilson</td>
            <td style="padding: 12px; color: #6a4c93; font-weight: bold;">79.99</td>
            <td style="padding: 12px; background: #ffe66d; color: #1a1a2e; border-radius: 5px; text-align: center;">PENDING</td>
        </tr>
    </table>
</body>
</html>
