<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body style="font-family: Arial; padding: 20px; background: #f0f8ff;">
    <h1 style="color: white; text-align: center; background: #ff6b6b; padding: 20px; border-radius: 10px;">Products</h1>
    
    <nav style="text-align: center; margin: 20px 0; padding: 15px; background: #1a1a2e; border-radius: 5px;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 20px; font-size: 18px;">Home</a>
        <a href="orders.html" style="color: white; text-decoration: none; margin: 0 20px; font-size: 18px;">Orders</a>
        <a href="login.html" style="color: white; text-decoration: none; margin: 0 20px; font-size: 18px;">Login</a>
    </nav>
    
    <div style="text-align: center; margin: 20px 0;">
        <button onclick="alert('Add Product clicked!')" style="background: #ff6b6b; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">Add Product</button>
    </div>
    
    <table style="width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <tr style="background: #ff6b6b; color: white;">
            <th style="padding: 15px; text-align: left;">ID</th>
            <th style="padding: 15px; text-align: left;">Name</th>
            <th style="padding: 15px; text-align: left;">Price</th>
            <th style="padding: 15px; text-align: left;">Stock</th>
        </tr>
        <tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;">1</td>
            <td style="padding: 12px;">Laptop</td>
            <td style="padding: 12px; color: #6a4c93; font-weight: bold;">999.99</td>
            <td style="padding: 12px; color: #4ecdc4; font-weight: bold;">10</td>
        </tr>
        <tr style="background: #f8f9fa; border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;">2</td>
            <td style="padding: 12px;">Mouse</td>
            <td style="padding: 12px; color: #6a4c93; font-weight: bold;">29.99</td>
            <td style="padding: 12px; color: #4ecdc4; font-weight: bold;">50</td>
        </tr>
        <tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;">3</td>
            <td style="padding: 12px;">Keyboard</td>
            <td style="padding: 12px; color: #6a4c93; font-weight: bold;">79.99</td>
            <td style="padding: 12px; color: #4ecdc4; font-weight: bold;">25</td>
        </tr>
    </table>
</body>
</html>
